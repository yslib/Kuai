[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "kupy"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = ["numpy"]

[tool.maturin]
module-name = "kupy._native"
python-source = "python"
bindings = "pyo3"
auditwheel = "skip"
include = [
  # maturin 1.15.0's tagged parser accepts the Rust field spelling, `crate_name`.
  { path = "install-local-release-cpu/lib/libkurt.dylib", from = "out-dir", crate_name = "kurt-sys", to = "kupy/_runtime_input/" },
  { path = "install-local-release-cpu/lib/libkurt_cpu.dylib", from = "out-dir", crate_name = "kurt-sys", to = "kupy/_runtime_input/" },
]

[tool.maturin.target.aarch64-apple-darwin]
macos-deployment-target = "26.0"

[tool.maturin.target.x86_64-apple-darwin]
macos-deployment-target = "26.0"

[tool.kurt-wheel]
delocate = "0.13.0"

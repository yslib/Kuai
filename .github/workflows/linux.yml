name: Linux x64

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build CPU + CUDA / x86_64-unknown-linux-gnu / llvm22
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build with Cargo
        shell: bash
        run: |
          image="$(<.github/images/cuda.lock)"
          [[ "$image" =~ ^ghcr\.io/yslib/kurt-build-cuda@sha256:[0-9a-f]{64}$ ]]
          docker run --rm --platform linux/amd64 --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" -v "$HOME/.cargo:/cargo" -v "$HOME/.rustup:/rustup:ro" \
            -e CARGO_HOME=/cargo -e RUSTUP_HOME=/rustup -e CUDAARCHS=80 \
            -e CMAKE_TOOLCHAIN_FILE=/work/kurt-cpp/cmake/toolchains/docker-cuda.cmake \
            -w /work "$image" bash -euo pipefail -c '
              export PATH="/cargo/bin:$PATH"
              export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER="$CC"
              cargo build --locked --features cpu,cuda -j 2
            '

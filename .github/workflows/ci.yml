name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  # Checkout only; the pinned GHCR images are consumed anonymously.
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: kurt-cpp/.clang-format-version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check C++ formatting
        run: cargo xtask cpp fmt --check
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Test formatting tasks
        run: cargo test -p xtask --locked

  host:
    name: host / ${{ matrix.target }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            toolchain: llvm22
            toolchain-file: cmake/toolchains/macos-clang.cmake
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            toolchain: llvm22
            toolchain-file: cmake/toolchains/docker-base.cmake
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install --force-bottle llvm@22 cmake ninja
      - name: Build and install macOS host
        if: runner.os == 'macOS'
        working-directory: kurt-cpp
        run: |
          cmake --preset release -G Ninja \
            --toolchain ${{ matrix.toolchain-file }} \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/kurt-host"
          cmake --build --preset release --parallel 4
          cmake --install build/release
      - name: Build and install Linux host
        if: runner.os == 'Linux'
        shell: bash
        run: |
          image="$(<.github/images/base.lock)"
          [[ "$image" =~ ^ghcr\.io/yslib/kurt-build-base@sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/kurt-host"
          docker run --rm --platform ${{ matrix.platform }} --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" -v "$RUNNER_TEMP:/runner-temp" \
            -w /work/kurt-cpp "$image" bash -euo pipefail -c '
              cmake --preset release -G Ninja \
                --toolchain ${{ matrix.toolchain-file }} \
                -DCMAKE_INSTALL_PREFIX=/runner-temp/kurt-host
              cmake --build --preset release --parallel 4
              cmake --install build/release
            '
      - name: Archive installed host
        run: tar -C "$RUNNER_TEMP/kurt-host" -czf "$RUNNER_TEMP/kurt-host.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kurt-host-${{ matrix.target }}-${{ matrix.toolchain }}-release
          path: ${{ runner.temp }}/kurt-host.tar.gz
          if-no-files-found: error

  cargo-host:
    name: cargo host / ${{ matrix.target }} / ${{ matrix.toolchain }}
    needs: host
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            toolchain: llvm22
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            toolchain: llvm22
    env:
      KUAI_RUNTIME_PRESET: release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kurt-host-${{ matrix.target }}-${{ matrix.toolchain }}-release
          path: ${{ runner.temp }}
      - name: Extract installed host
        run: |
          echo "CMAKE_INSTALL_PREFIX=$RUNNER_TEMP/kurt-host" >>"$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/kurt-host"
          tar -xzf "$RUNNER_TEMP/kurt-host.tar.gz" -C "$RUNNER_TEMP/kurt-host"
      - name: Build Rust workspace against installed host
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          export LD_LIBRARY_PATH="$CMAKE_INSTALL_PREFIX/lib"
          cargo build --workspace --locked
      - name: Test host runtime and host-only behavior
        run: |
          export LD_LIBRARY_PATH="$CMAKE_INSTALL_PREFIX/lib"
          export DYLD_LIBRARY_PATH="$CMAKE_INSTALL_PREFIX/lib"
          cargo test -p kurt-sys -p kurt --locked
          cargo test -p kurt-sys --test host_only --locked -- --ignored

  vendor:
    name: vendor / ${{ matrix.preset }} / ${{ matrix.target }} / ${{ matrix.toolchain }}
    needs: host
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            toolchain: llvm22
            vendor: cpu
            preset: release-cpu-macos-clang
            artifact: kurt-vendor-cpu-aarch64-apple-darwin-llvm22-release
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            toolchain: llvm22
            platform: linux/amd64
            vendor: cpu
            image: base
            preset: release-cpu-linux-clang
            artifact: kurt-vendor-cpu-x86_64-unknown-linux-gnu-llvm22-release
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            toolchain: llvm22
            platform: linux/amd64
            vendor: cuda
            image: cuda
            preset: release-cuda-linux-clang
            artifact: kurt-vendor-cuda-x86_64-unknown-linux-gnu-llvm22-clang-release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kurt-host-${{ matrix.target }}-${{ matrix.toolchain }}-release
          path: ${{ runner.temp }}
      - name: Extract installed host
        run: |
          mkdir -p "$RUNNER_TEMP/kurt-host"
          tar -xzf "$RUNNER_TEMP/kurt-host.tar.gz" -C "$RUNNER_TEMP/kurt-host"
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install --force-bottle llvm@22 cmake ninja
      - name: Build and install macOS vendor
        if: runner.os == 'macOS'
        working-directory: kurt-cpp/vendor
        run: |
          cmake --preset ${{ matrix.preset }} -G Ninja \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/kurt-host" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/kurt-vendor-${{ matrix.vendor }}"
          cmake --build --preset ${{ matrix.preset }} --parallel 2
          cmake --install ../build/${{ matrix.preset }}
          mkdir -p "$RUNNER_TEMP/vendor-query-${{ matrix.vendor }}"
          printf 'cmake_minimum_required(VERSION 4.1)\nproject(vendor_query LANGUAGES NONE)\nfind_package(kuai_vendor_${{ matrix.vendor }} 0.1.0 EXACT CONFIG REQUIRED)\n' \
            > "$RUNNER_TEMP/vendor-query-${{ matrix.vendor }}/CMakeLists.txt"
          cmake -S "$RUNNER_TEMP/vendor-query-${{ matrix.vendor }}" \
            -B "$RUNNER_TEMP/vendor-query-${{ matrix.vendor }}/build" -G Ninja \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/kurt-vendor-${{ matrix.vendor }}"
      - name: Build and install Linux vendor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          image="$(<.github/images/${{ matrix.image }}.lock)"
          [[ "$image" =~ ^ghcr\.io/yslib/kurt-build-${{ matrix.image }}@sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/kurt-vendor-${{ matrix.vendor }}"
          docker run --rm --platform ${{ matrix.platform }} --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" -v "$RUNNER_TEMP:/runner-temp" \
            -w /work/kurt-cpp/vendor "$image" bash -euo pipefail -c '
              cmake --preset ${{ matrix.preset }} -G Ninja \
                -DCMAKE_PREFIX_PATH=/runner-temp/kurt-host \
                -DCMAKE_INSTALL_PREFIX=/runner-temp/kurt-vendor-${{ matrix.vendor }}
              cmake --build --preset ${{ matrix.preset }} --parallel 2
              cmake --install /work/kurt-cpp/build/${{ matrix.preset }}
              mkdir -p /runner-temp/vendor-query-${{ matrix.vendor }}
              printf "cmake_minimum_required(VERSION 4.1)\nproject(vendor_query LANGUAGES NONE)\nfind_package(kuai_vendor_${{ matrix.vendor }} 0.1.0 EXACT CONFIG REQUIRED)\n" \
                > /runner-temp/vendor-query-${{ matrix.vendor }}/CMakeLists.txt
              cmake -S /runner-temp/vendor-query-${{ matrix.vendor }} \
                -B /runner-temp/vendor-query-${{ matrix.vendor }}/build -G Ninja \
                -DCMAKE_PREFIX_PATH=/runner-temp/kurt-vendor-${{ matrix.vendor }}
            '
      - name: Archive installed vendor
        run: |
          tar -C "$RUNNER_TEMP/kurt-vendor-${{ matrix.vendor }}" \
            -czf "$RUNNER_TEMP/kurt-vendor-${{ matrix.vendor }}.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/kurt-vendor-${{ matrix.vendor }}.tar.gz
          if-no-files-found: error

  cargo-cpu:
    name: cargo cpu / ${{ matrix.target }} / ${{ matrix.toolchain }}
    needs: [host, vendor]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            toolchain: llvm22
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            toolchain: llvm22
    env:
      KUAI_RUNTIME_PRESET: release-cpu
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kurt-host-${{ matrix.target }}-${{ matrix.toolchain }}-release
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kurt-vendor-cpu-${{ matrix.target }}-${{ matrix.toolchain }}-release
          path: ${{ runner.temp }}
      - name: Extract host and CPU vendor
        run: |
          echo "CMAKE_INSTALL_PREFIX=$RUNNER_TEMP/kurt-runtime" >>"$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/kurt-runtime"
          tar -xzf "$RUNNER_TEMP/kurt-host.tar.gz" -C "$RUNNER_TEMP/kurt-runtime"
          tar -xzf "$RUNNER_TEMP/kurt-vendor-cpu.tar.gz" -C "$RUNNER_TEMP/kurt-runtime"
      - name: Test runtime bindings and safe Rust interface with CPU vendor
        run: |
          export LD_LIBRARY_PATH="$CMAKE_INSTALL_PREFIX/lib"
          export DYLD_LIBRARY_PATH="$CMAKE_INSTALL_PREFIX/lib"
          cargo test -p kurt-sys -p kurt --locked

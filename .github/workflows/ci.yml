name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  # Checkout only; the pinned GHCR images are consumed anonymously.
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: kuai-runtime/.clang-format-version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check C++ formatting
        run: cargo xtask cpp fmt --check
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Test formatting tasks
        run: cargo test -p xtask --locked

  runtime-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cpu
            lock: Docker_base.ci.lock
            image_prefix: ghcr.io/yslib/kuai-runtime-base
            preset: release-cpu
            target: ""
          - backend: cuda
            lock: Docker_cuda.ci.lock
            image_prefix: ghcr.io/yslib/kuai-runtime-cuda
            preset: release-cuda
            target: kurt_cuda
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve ${{ matrix.backend }} toolchain image
        shell: bash
        run: |
          image="$(<kuai-runtime/docker/${{ matrix.lock }})"
          prefix="${{ matrix.image_prefix }}:"
          tag="${image#"$prefix"}"
          test "$image" != "$tag"
          [[ "$tag" =~ ^[0-9a-f]{40}$ ]]
          echo "KUAI_CI_IMAGE=$image" >>"$GITHUB_ENV"
      - name: Configure ${{ matrix.backend }} runtime
        shell: bash
        run: |
          docker run --rm \
              -u "$(id -u):$(id -g)" \
              -v "$PWD:$PWD" \
              -w "$PWD/kuai-runtime" \
              "$KUAI_CI_IMAGE" \
              cmake --preset "${{ matrix.preset }}"
      - name: Check ${{ matrix.backend }} syntax
        shell: bash
        run: |
          args=(
              --build-dir "kuai-runtime/build/${{ matrix.preset }}"
              --jobs 8
          )
          if [[ -n "${{ matrix.target }}" ]]; then
              args+=(--target "${{ matrix.target }}")
          fi
          docker run --rm \
              -u "$(id -u):$(id -g)" \
              -v "$PWD:$PWD" \
              -w "$PWD" \
              "$KUAI_CI_IMAGE" \
              /opt/venv314/bin/python scripts/clang_syntax_check.py "${args[@]}"

  cargo-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve CPU toolchain image
        shell: bash
        run: |
          image="$(<kuai-runtime/docker/Docker_base.ci.lock)"
          [[ "$image" =~ ^ghcr\.io/yslib/kuai-runtime-base:[0-9a-f]{40}$ ]]
          echo "KUAI_RUNTIME_DOCKER_IMAGE=$image" >>"$GITHUB_ENV"
      - name: Build Rust workspace with CPU runtime
        env:
          KUAI_RUNTIME_BUILD_MODE: docker
          KUAI_RUNTIME_PRESET: release-cpu
        run: cargo build --workspace --locked
      - name: Test kuai-sys C ABI
        env:
          KUAI_RUNTIME_BUILD_MODE: docker
          KUAI_RUNTIME_PRESET: release-cpu
        run: cargo test -p kuai-sys --locked

  cargo-cuda:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve CUDA toolchain image
        shell: bash
        run: |
          image="$(<kuai-runtime/docker/Docker_cuda.ci.lock)"
          [[ "$image" =~ ^ghcr\.io/yslib/kuai-runtime-cuda:[0-9a-f]{40}$ ]]
          echo "KUAI_RUNTIME_DOCKER_IMAGE=$image" >>"$GITHUB_ENV"
      - name: Test kuai-sys with CUDA runtime
        env:
          KUAI_RUNTIME_BUILD_MODE: docker
          KUAI_RUNTIME_PRESET: release-cuda
        run: cargo test -p kuai-sys --locked

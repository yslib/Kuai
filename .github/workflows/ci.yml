name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve formatter image
        shell: bash
        run: |
          image="$(<kuai-runtime/docker/FormatDocker.ci.lock)"
          [[ "$image" =~ ^ghcr\.io/yslib/kuai-runtime-format:[0-9a-f]{40}$ ]]
          echo "KUAI_FORMAT_DOCKER_IMAGE=$image" >>"$GITHUB_ENV"
      - name: Check C++ formatting
        run: ./scripts/cppformat_check.sh kuai-runtime/src kuai-runtime/vendor kuai-runtime/python/bindings
      - name: Check Rust formatting
        run: cargo fmt --all --check

  runtime-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cpu
            lock: Docker_base.ci.lock
            image_prefix: ghcr.io/yslib/kuai-runtime-base
            preset: release-cpu
            target: ""
          - backend: cuda
            lock: Docker_cuda.ci.lock
            image_prefix: ghcr.io/yslib/kuai-runtime-cuda
            preset: release-cuda
            target: kurt_cuda
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve ${{ matrix.backend }} toolchain image
        shell: bash
        run: |
          image="$(<kuai-runtime/docker/${{ matrix.lock }})"
          prefix="${{ matrix.image_prefix }}:"
          tag="${image#"$prefix"}"
          test "$image" != "$tag"
          [[ "$tag" =~ ^[0-9a-f]{40}$ ]]
          echo "KUAI_CI_IMAGE=$image" >>"$GITHUB_ENV"
      - name: Configure ${{ matrix.backend }} runtime
        shell: bash
        run: |
          docker run --rm \
              -u "$(id -u):$(id -g)" \
              -v "$PWD:$PWD" \
              -w "$PWD/kuai-runtime" \
              "$KUAI_CI_IMAGE" \
              cmake --preset "${{ matrix.preset }}"
      - name: Check ${{ matrix.backend }} syntax
        shell: bash
        run: |
          args=(
              --build-dir "kuai-runtime/build/${{ matrix.preset }}"
              --jobs 8
          )
          if [[ -n "${{ matrix.target }}" ]]; then
              args+=(--target "${{ matrix.target }}")
          fi
          docker run --rm \
              -u "$(id -u):$(id -g)" \
              -v "$PWD:$PWD" \
              -w "$PWD" \
              "$KUAI_CI_IMAGE" \
              /opt/venv314/bin/python scripts/clang_syntax_check.py "${args[@]}"

  cargo-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve CPU toolchain image
        shell: bash
        run: |
          image="$(<kuai-runtime/docker/Docker_base.ci.lock)"
          [[ "$image" =~ ^ghcr\.io/yslib/kuai-runtime-base:[0-9a-f]{40}$ ]]
          echo "KUAI_RUNTIME_DOCKER_IMAGE=$image" >>"$GITHUB_ENV"
      - name: Build Rust workspace with CPU runtime
        env:
          KUAI_RUNTIME_BUILD_MODE: docker
          KUAI_RUNTIME_PRESET: release-cpu
        run: cargo build --workspace --locked
      - name: Test kuai-sys C ABI
        env:
          KUAI_RUNTIME_BUILD_MODE: docker
          KUAI_RUNTIME_PRESET: release-cpu
        run: cargo test -p kuai-sys --locked

  cargo-cuda:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve CUDA toolchain image
        shell: bash
        run: |
          image="$(<kuai-runtime/docker/Docker_cuda.ci.lock)"
          [[ "$image" =~ ^ghcr\.io/yslib/kuai-runtime-cuda:[0-9a-f]{40}$ ]]
          echo "KUAI_RUNTIME_DOCKER_IMAGE=$image" >>"$GITHUB_ENV"
      - name: Test kuai-sys with CUDA runtime
        env:
          KUAI_RUNTIME_BUILD_MODE: docker
          KUAI_RUNTIME_PRESET: release-cuda
        run: cargo test -p kuai-sys --locked

name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  # Checkout only; the pinned GHCR images are consumed anonymously.
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: kurt-cpp/.clang-format-version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check C++ formatting
        run: cargo xtask cpp fmt --check
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Test formatting tasks
        run: cargo test -p xtask --locked

  cargo-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve CPU toolchain image
        shell: bash
        run: |
          image="$(<.github/images/base.lock)"
          [[ "$image" =~ ^ghcr\.io/yslib/kurt-build-base@sha256:[0-9a-f]{64}$ ]]
          echo "KUAI_RUNTIME_DOCKER_IMAGE=$image" >>"$GITHUB_ENV"
      - name: Build Rust workspace with CPU runtime
        env:
          KUAI_RUNTIME_BUILD_MODE: docker
          KUAI_RUNTIME_PRESET: release-cpu
        run: cargo build --workspace --locked
      - name: Test runtime bindings and safe Rust interface
        env:
          KUAI_RUNTIME_BUILD_MODE: docker
          KUAI_RUNTIME_PRESET: release-cpu
        run: cargo test -p kurt-sys -p kurt --locked

  cargo-cuda:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve CUDA toolchain image
        shell: bash
        run: |
          image="$(<.github/images/cuda.lock)"
          [[ "$image" =~ ^ghcr\.io/yslib/kurt-build-cuda@sha256:[0-9a-f]{64}$ ]]
          echo "KUAI_RUNTIME_DOCKER_IMAGE=$image" >>"$GITHUB_ENV"
      - name: Test Rust runtime interfaces with CUDA runtime
        env:
          KUAI_RUNTIME_BUILD_MODE: docker
          KUAI_RUNTIME_PRESET: release-cuda
        run: cargo test -p kurt-sys -p kurt --locked

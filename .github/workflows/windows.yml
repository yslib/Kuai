name: Windows x64

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build CPU + CUDA / x86_64-pc-windows-msvc / msvc143-nvcc13.2
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/kurt-cpp/cmake/toolchains/windows-cuda-nvcc.cmake
      CUDAARCHS: "80"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: x64
          vsversion: "2022"
      - name: Install CMake
        run: python -m pip install cmake==4.1.3
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: '13.2.0'
          method: network
          sub-packages: '["nvcc", "crt", "nvvm", "cudart", "thrust", "cublas", "cublas_dev", "curand", "curand_dev", "cusolver", "cusolver_dev", "cusparse", "cusparse_dev", "nvjitlink"]'
      - name: Build with Cargo
        run: cargo build --locked --features cpu,cuda -j 2

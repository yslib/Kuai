name: macOS arm64

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build CPU / aarch64-apple-darwin / llvm22
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/kurt-cpp/cmake/toolchains/macos-clang.cmake
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build tools
        run: brew install --force-bottle llvm@22 cmake ninja
      - name: Build with Cargo
        run: cargo build --locked --features cpu -j 2
